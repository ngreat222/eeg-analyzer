name: 发布桌面更新通知

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["macOS 版"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: biap-stable-update-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 准备签名工具与当前清单
        run: |
          python -m pip install 'cryptography==46.0.5'
          git fetch origin refs/heads/update-feed
          git worktree add --detach "$RUNNER_TEMP/feed" FETCH_HEAD
      - name: 核对正式版安装包并签署通知
        env:
          GH_TOKEN: ${{ github.token }}
          BIAP_UPDATE_SIGNING_KEY: ${{ secrets.BIAP_UPDATE_SIGNING_KEY }}
        run: python scripts/publish_update.py "$RUNNER_TEMP/feed/latest.json"
      - name: 发布更新清单
        run: |
          cd "$RUNNER_TEMP/feed"
          git add latest.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish verified desktop update"
          git push origin HEAD:refs/heads/update-feed
